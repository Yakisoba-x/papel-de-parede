<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papel de parede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700&family=Outfit:wght@200;300;500&family=Pacifico&family=Playfair+Display:wght@400;700&family=Space+Mono&family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0e1030; --bg2:#14325a; --bg3:#3a1a4d;
  --text:#f2f4ff; --muted:#a9b3d6; --accent:#7ff0d8; --accent2:#b9a2ff; --glow:#6a5cff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;cursor:crosshair}
body{
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(60% 50% at 18% 20%,var(--bg3) 0%,transparent 70%),
    radial-gradient(70% 60% at 85% 85%,var(--bg2) 0%,transparent 70%),
    var(--bg1);
}
#fontSel{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:clamp(20px,4vw,56px);cursor:pointer;background:rgba(20,20,40,.35);border:1px solid rgba(169,179,214,.4);border-radius:999px;padding:8px 12px;color:var(--muted);font:300 14px/1 'Outfit',system-ui,sans-serif}
#fontSel option{color:#111}
#fontSel:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#lyrBtn{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:clamp(20px,4vw,56px);cursor:pointer;background:none;border:1px solid rgba(169,179,214,.4);border-radius:999px;padding:8px 14px;color:var(--muted);font:300 14px/1 'Outfit',system-ui,sans-serif}
#lyrBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#lyrics{position:fixed;left:clamp(24px,5vw,80px);top:calc(8vh + env(safe-area-inset-top,0px));bottom:170px;width:min(38vw,520px);display:flex;align-items:center}
#lyrics[hidden]{display:none}
#lyrBody{font-weight:500;font-size:clamp(24px,3vw,46px);line-height:1.25;color:var(--text);text-shadow:0 0 28px var(--glow),0 2px 18px rgba(0,0,0,.45)}
#lyrBody .w{display:inline-block;white-space:nowrap}
#lyrBody .ch{display:inline-block;opacity:0;transform:translateY(.55em) scale(.85);filter:blur(7px);animation:chIn .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes chIn{to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){#lyrBody .ch{animation:none;opacity:1;transform:none;filter:none}}
body.lyr main{align-items:flex-end;text-align:right}
body.lyr #clock{font-size:calc(clamp(72px,12vw,190px)*var(--cs,1))}
body.lyr #now{margin-left:auto}
body.lyr #np{text-align:right}
@media (max-width:800px){#lyrics{display:none}body.lyr main{align-items:flex-start;text-align:left}body.lyr #clock{font-size:calc(clamp(88px,22vw,300px)*var(--cs,1))}body.lyr #now{margin-left:0}body.lyr #np{text-align:left}}
#cover{position:fixed;inset:-6%;background-size:cover;background-position:center;filter:blur(42px) saturate(1.25);opacity:0;transition:opacity 1.4s;pointer-events:none}
#cover.on{opacity:.5}
@media (prefers-reduced-motion:reduce){#cover{transition:none}}
#glow{position:fixed;inset:-10%;background:radial-gradient(closest-side,var(--glow),transparent 70%);opacity:.15;will-change:opacity,transform;pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{
  position:relative;height:100%;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;
  padding:0 clamp(24px,8vw,120px);pointer-events:none;
}
#clock{
  font-weight:200;line-height:.9;letter-spacing:-.03em;
  font-size:calc(clamp(88px,22vw,300px)*var(--cs,1));font-variant-numeric:tabular-nums lining-nums;
}
#clock .sec{font-size:.28em;font-weight:300;color:var(--accent);letter-spacing:0;margin-left:.15em}
#date{
  margin-top:clamp(12px,2vw,28px);font-weight:300;
  font-size:clamp(18px,3vw,40px);color:var(--muted);
}
#bat{
  position:fixed;right:clamp(20px,4vw,56px);bottom:calc(clamp(20px,4vw,48px) + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;font-weight:300;font-size:clamp(18px,2.4vw,30px);
}
.cell{
  width:56px;height:26px;border:2px solid var(--muted);border-radius:7px;padding:3px;position:relative;
}
.cell::after{content:"";position:absolute;right:-7px;top:7px;width:4px;height:8px;border-radius:0 3px 3px 0;background:var(--muted)}
#fill{height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .6s}
#fill.low{background:#ff8a7a}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:14px;color:var(--muted);opacity:.6;transition:opacity 1s}
#now{margin-top:clamp(16px,2.5vw,36px);display:flex;align-items:center;gap:10px;pointer-events:auto;width:min(100%,560px)}
#now span{color:var(--accent);font-size:clamp(18px,2.4vw,30px)}
#np{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid rgba(169,179,214,.35);color:var(--text);font:300 clamp(18px,2.4vw,30px)/1.3 'Outfit',system-ui,sans-serif;padding:4px 0}
#np::placeholder{color:var(--muted);opacity:.7}
#tok{margin-top:10px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;color:var(--muted);opacity:.7;font:300 14px/1 'Outfit',system-ui,sans-serif;text-decoration:underline}
#tok:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
#np:focus-visible{outline:none;border-bottom-color:var(--accent)}
#sound{position:fixed;left:clamp(24px,8vw,120px);bottom:calc(clamp(20px,4vw,48px) + env(safe-area-inset-bottom,0px));width:min(42vw,280px);cursor:pointer;background:none;border:0;color:var(--muted);font:300 14px/1 'Outfit',system-ui,sans-serif;text-align:left}
#bars{display:flex;align-items:flex-end;gap:4px;height:56px;margin-bottom:10px}
#bars i{flex:1;height:4px;border-radius:3px;background:linear-gradient(to top,var(--accent),var(--accent2));opacity:.85}
#sound:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
@media (prefers-reduced-motion:reduce){#fill{transition:none}}
</style>
</head>
<body>
<div id="cover" aria-hidden="true"></div>
<div id="glow" aria-hidden="true"></div>
<canvas id="trail" aria-hidden="true"></canvas>
<main>
  <div id="clock" aria-live="off">00:00<span class="sec">00</span></div>
  <div id="date"></div>
  <label id="now"><span aria-hidden="true">♪</span><input id="np" type="text" maxlength="90" placeholder="Digite a música que está tocando" aria-label="Música tocando agora"></label>
  <button id="tok" type="button">Colar chave de reconhecimento (AudD)</button>
</main>
<button id="lyrBtn" type="button" aria-pressed="true">Letra: ligada</button>
<select id="fontSel" aria-label="Fonte do relógio"></select>
<aside id="lyrics" hidden aria-label="Letra da música"><div id="lyrBody"></div></aside>
<div id="bat"><div class="cell"><div id="fill"></div></div><span id="pct">--</span></div>
<button id="sound" type="button"><div id="bars" aria-hidden="true"></div><span id="soundLabel">Captar o som do notebook</span></button>
<div id="hint">Mova o mouse para desenhar</div>

<script>
// Relógio e data
const clock=document.getElementById('clock'), dateEl=document.getElementById('date');
const p=n=>String(n).padStart(2,'0');
function tick(){
  const d=new Date();
  clock.innerHTML=p(d.getHours())+':'+p(d.getMinutes())+'<span class="sec">'+p(d.getSeconds())+'</span>';
  const t=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  dateEl.textContent=t.charAt(0).toUpperCase()+t.slice(1);
}
tick(); setInterval(tick,1000);

// Bateria (funciona em Chrome, Edge e Opera)
const fill=document.getElementById('fill'), pct=document.getElementById('pct');
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    const up=()=>{
      const v=Math.round(b.level*100);
      fill.style.width=v+'%';
      fill.classList.toggle('low',v<=20&&!b.charging);
      pct.textContent=v+'%'+(b.charging?' carregando':'');
    };
    up();
    b.addEventListener('levelchange',up);
    b.addEventListener('chargingchange',up);
  }).catch(()=>{pct.textContent='Bateria indisponível'});
}else{
  pct.textContent='Bateria indisponível neste navegador';
}

// Rastro do mouse
const cv=document.getElementById('trail'), ctx=cv.getContext('2d');
let W,H,dpr; const pts=[]; const LIFE=1100;
function resize(){
  dpr=window.devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener('resize',resize);
addEventListener('pointermove',e=>{
  pts.push({x:e.clientX,y:e.clientY,t:performance.now()});
  document.getElementById('hint').style.opacity=0;
});
function draw(now){
  ctx.clearRect(0,0,W,H);
  while(pts.length&&now-pts[0].t>LIFE) pts.shift();
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    const age=(now-b.t)/LIFE, k=1-age;
    if(Math.hypot(b.x-a.x,b.y-a.y)>300) continue;
    ctx.strokeStyle='hsla('+(theme.hue+((now/8+i*3)%theme.range))+',90%,70%,'+(k*.9)+')';
    ctx.lineWidth=2+k*10;
    ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=18*k;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// Barra de som (reage ao áudio do microfone)
const N=20, barsEl=document.getElementById('bars'), label=document.getElementById('soundLabel');
for(let i=0;i<N;i++) barsEl.appendChild(document.createElement('i'));
const barEls=[...barsEl.children];
let analyser=null, data=null, on=false, capStream=null;
const glow=document.getElementById('glow'); let pulse=0;
function loop(){
  let target=0;
  if(analyser){
    analyser.getByteFrequencyData(data);
    target=Math.max(0,Math.min(1,((data[0]+data[1]+data[2])/3/255-0.45)/0.45));
    for(let i=0;i<N;i++){
      const v=data[Math.floor(i*data.length*0.7/N)]/255;
      barEls[i].style.height=(4+v*52)+'px';
    }
  }
  const loopNow=performance.now();
  if(lyrOn&&lyrText&&lyrLines.length&&lyrLen&&loopNow>lyrPause){
    const f=Math.max(0,Math.min(.9999,((loopNow-lyrStart)/lyrLen-0.05)/0.88));
    const tw=f*lyrCum[lyrCum.length-1];
    let li=0; while(li<lyrCum.length-1&&lyrCum[li]<=tw) li++;
    if(li!==lyrCur) showLine(li);
  }
  pulse+=(target-pulse)*(target>pulse?0.5:0.08);
  glow.style.opacity=(0.15+pulse*0.75).toFixed(3);
  glow.style.transform='scale('+(1+pulse*0.3).toFixed(3)+')';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('sound').addEventListener('click',async()=>{
  if(on){ on=false; analyser=null; barEls.forEach(b=>b.style.height='4px'); label.textContent='Captar o som do notebook'; return; }
  try{
    const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    if(!stream.getAudioTracks().length){ stream.getTracks().forEach(t=>t.stop()); label.textContent='Sem áudio. Marque "Compartilhar áudio" ao escolher a aba ou tela'; return; }
    capStream=stream;
    stream.getAudioTracks()[0].addEventListener('ended',()=>{ on=false; analyser=null; barEls.forEach(b=>b.style.height='4px'); label.textContent='Captar o som do notebook'; });
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser(); analyser.fftSize=128; analyser.smoothingTimeConstant=.6;
    src.connect(analyser); data=new Uint8Array(analyser.frequencyBinCount);
    on=true; label.textContent='Captando o som do notebook. Clique para parar';setTimeout(recognize,2500);
  }catch(e){
    label.textContent='Não deu para captar o áudio. Escolha uma aba e marque "Compartilhar áudio"';
  }
});

// Nome da música (digitado e lembrado neste navegador)
const np=document.getElementById('np');
try{ np.value=localStorage.getItem('np')||''; }catch(e){}
np.addEventListener('input',()=>{ try{ localStorage.setItem('np',np.value); }catch(e){} });

// Temas por música/artista: se o texto do campo ♪ tiver alguma das palavras em 'match', o fundo troca de cor.
// Para criar outro tema, copie um bloco e mude as palavras e as cores.
const THEMES=[
  {match:['trash poll','trashpoll','biozard'], bg1:'#06160d', bg2:'#0f4a24', bg3:'#1d6b2a', accent:'#7dff6b', accent2:'#2fe0a0', glow:'#2bff5e', hue:95, range:70}
];
const DEFAULT_THEME={bg1:'#0e1030',bg2:'#14325a',bg3:'#3a1a4d',accent:'#7ff0d8',accent2:'#b9a2ff',glow:'#6a5cff',hue:0,range:360};
let theme=DEFAULT_THEME, lastNp=null, songColor=null;
function themeFromHue(h,s){
  const sat=Math.round(25+65*Math.min(1,s));
  const hsl=(hh,ss,l)=>'hsl('+Math.round(hh)+','+Math.round(ss)+'%,'+l+'%)';
  return {bg1:hsl(h,sat*.7,6),bg2:hsl(h,sat*.8,18),bg3:hsl(h+20,sat*.7,26),accent:hsl(h,Math.max(sat,70),72),accent2:hsl(h+40,Math.max(sat,70),68),glow:hsl(h,Math.max(sat,80),55),hue:h-25,range:60};
}
function hashHue(str){ let h=0; for(const ch of str) h=(h*31+ch.charCodeAt(0))>>>0; return h%360; }
// Pega a cor dominante da capa do álbum (se o navegador deixar ler a imagem)
function colorFromImage(url){
  return new Promise(res=>{
    const im=new Image(); im.crossOrigin='anonymous';
    const to=setTimeout(()=>res(null),6000);
    im.onerror=()=>{ clearTimeout(to); res(null); };
    im.onload=()=>{
      clearTimeout(to);
      try{
        const c=document.createElement('canvas'); c.width=c.height=40;
        const x=c.getContext('2d'); x.drawImage(im,0,0,40,40);
        const d=x.getImageData(0,0,40,40).data;
        const w=new Array(12).fill(0), sh=new Array(12).fill(0), ss=new Array(12).fill(0);
        let tot=0;
        for(let i=0;i<d.length;i+=4){
          const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
          const mx=Math.max(r,g,b), df=mx-Math.min(r,g,b);
          if(mx<.15||df<.12) continue;
          let h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;
          h=(h*60+360)%360;
          const sat=df/mx, wt=sat*mx, k=Math.floor(h/30)%12;
          w[k]+=wt; sh[k]+=wt*h; ss[k]+=wt*sat; tot+=wt;
        }
        if(tot<1){ res({h:0,s:0}); return; }
        let best=0; for(let k=1;k<12;k++) if(w[k]>w[best]) best=k;
        res({h:sh[best]/w[best], s:ss[best]/w[best]});
      }catch(e){ res(null); }
    };
    im.src=url;
  });
}
// Fontes do relógio (n = nome no menu, w = peso, ls = espaçamento, s = escala do tamanho)
const FONTS=[
  {n:'Fina',f:"'Outfit'",w:200,ls:'-.03em',s:1},
  {n:'Digital',f:"'Orbitron'",w:400,ls:'0',s:.78},
  {n:'Condensada',f:"'Bebas Neue'",w:400,ls:'.01em',s:1.12},
  {n:'Máquina',f:"'Space Mono'",w:400,ls:'-.04em',s:.82},
  {n:'Larga',f:"'Unbounded'",w:300,ls:'-.03em',s:.62},
  {n:'Cursiva',f:"'Pacifico'",w:400,ls:'0',s:.85},
  {n:'Clássica',f:"'Playfair Display'",w:400,ls:'-.02em',s:.95}
];
const fontSel=document.getElementById('fontSel');
FONTS.forEach((x,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent='Fonte: '+x.n; fontSel.appendChild(o); });
function setFont(i){
  const x=FONTS[i]||FONTS[0];
  clock.style.fontFamily=x.f+",system-ui,-apple-system,'Segoe UI',sans-serif";
  clock.style.fontWeight=x.w; clock.style.letterSpacing=x.ls;
  document.documentElement.style.setProperty('--cs',x.s);
  fontSel.value=String(FONTS.indexOf(x));
}
let fi=0; try{ fi=parseInt(localStorage.getItem('clockFont'))||0; }catch(e){}
setFont(fi);
fontSel.addEventListener('change',()=>{ setFont(+fontSel.value); try{ localStorage.setItem('clockFont',fontSel.value); }catch(e){} });

// Letra da música (lado esquerdo), com botão para ligar/desligar
const lyr=document.getElementById('lyrics'), lyrBody=document.getElementById('lyrBody'), lyrBtn=document.getElementById('lyrBtn');
let lyrOn=true, lyrText='', lyrStart=0, lyrLen=0, lyrPause=0, curSong=null;
try{ lyrOn=localStorage.getItem('lyrOn')!=='0'; }catch(e){}
function paintLyrics(){
  const show=lyrOn&&!!lyrText;
  document.body.classList.toggle('lyr',show);
  lyr.hidden=!show;
  lyrBtn.textContent='Letra: '+(lyrOn?'ligada':'desligada');
  lyrBtn.setAttribute('aria-pressed',String(lyrOn));
}
let lyrLines=[], lyrCum=[], lyrCur=-1;
// Quebra a letra em frases e calcula o peso de cada uma (frase maior dura mais)
function buildLines(){
  lyrLines=lyrText.split('\n').map(s=>s.trim()).filter(s=>s&&!(s.startsWith('[')&&s.endsWith(']')));
  lyrCum=[]; let t=0;
  for(const l of lyrLines){ t+=l.length+8; lyrCum.push(t); }
  lyrCur=-1;
}
// Mostra só a frase atual, com cada letra entrando em sequência
function showLine(i){
  lyrCur=i; lyrBody.innerHTML='';
  const line=lyrLines[i]||'';
  const n=line.replace(/ /g,'').length||1, step=Math.min(28,800/n);
  let k=0;
  line.split(' ').forEach((word,wi)=>{
    if(wi) lyrBody.appendChild(document.createTextNode(' '));
    const w=document.createElement('span'); w.className='w';
    for(const ch of word){
      const s=document.createElement('span'); s.className='ch'; s.textContent=ch;
      s.style.animationDelay=Math.round(k++*step)+'ms';
      w.appendChild(s);
    }
    lyrBody.appendChild(w);
  });
}
async function loadLyrics(song){
  if(!lyrOn) return;
  try{
    if(!token) return;
    const fd=new FormData(); fd.append('api_token',token); fd.append('q',(song.artist+' '+song.title).trim());
    const r=await fetch('https://api.audd.io/findLyrics/',{method:'POST',body:fd});
    const j=await r.json();
    if(curSong!==song) return;
    const hit=(j.result||[]).find(x=>x&&x.lyrics);
    if(hit){ lyrText=hit.lyrics.trim(); buildLines(); }
  }catch(e){}
  paintLyrics();
}
function onRecognized(res,name){
  const tc=s=>{ const p=String(s||'').split(':').map(Number); return (!p.length||p.some(isNaN))?0:p.reduce((a,v)=>a*60+v,0); };
  lyrStart=performance.now()-(tc(res.timecode)+9)*1000;
  lyrLen=tc(res.song_length)*1000||210000;
  if(!curSong||curSong.name!==name){
    curSong={artist:res.artist||'',title:res.title,name:name};
    lyrText=''; lyrBody.textContent=''; paintLyrics();
    loadLyrics(curSong);
  }
}
lyrBtn.addEventListener('click',()=>{
  lyrOn=!lyrOn;
  try{ localStorage.setItem('lyrOn',lyrOn?'1':'0'); }catch(e){}
  paintLyrics();
  if(lyrOn&&curSong&&!lyrText) loadLyrics(curSong);
});
['wheel','touchmove'].forEach(ev=>lyrBody.addEventListener(ev,()=>{ lyrPause=performance.now()+15000; },{passive:true}));
paintLyrics();

const coverEl=document.getElementById('cover');
function setCover(url,name){
  coverEl.dataset.name=name;
  if(!url){ coverEl.classList.remove('on'); return; }
  const im=new Image();
  im.onload=()=>{ if(coverEl.dataset.name!==name) return; coverEl.style.backgroundImage='url("'+url+'")'; coverEl.classList.add('on'); };
  im.onerror=()=>coverEl.classList.remove('on');
  im.src=url;
}
async function setSongColor(result,name){
  let url=null;
  const am=result.apple_music, sp=result.spotify;
  if(am&&am.artwork&&am.artwork.url) url=am.artwork.url.replace('{w}','600').replace('{h}','600');
  else if(sp&&sp.album&&sp.album.images&&sp.album.images.length) url=sp.album.images[0].url;
  setCover(url,name);
  let c=url?await colorFromImage(url):null;
  if(!c) c={h:hashHue(name),s:.9}; // sem capa legível: cada música ganha uma cor própria
  songColor={h:Math.round(c.h),s:c.s,name:name};
  lastNp=null; applyTheme();
}
function applyTheme(){
  if(np.value===lastNp) return;
  lastNp=np.value;
  if(coverEl.dataset.name!==np.value) coverEl.classList.remove('on');
  if(curSong&&curSong.name!==np.value){ curSong=null; lyrText=''; lyrBody.textContent=''; paintLyrics(); }
  const t=np.value.toLowerCase();
  const fixed=THEMES.find(x=>x.match.some(m=>t.includes(m)));
  theme=fixed||(songColor&&songColor.name===np.value?themeFromHue(songColor.h,songColor.s):DEFAULT_THEME);
  const r=document.documentElement.style;
  for(const k of ['bg1','bg2','bg3','accent','accent2','glow']) r.setProperty('--'+k,theme[k]);
}
applyTheme(); setInterval(applyTheme,1000);

// Reconhecimento automático da música (AudD): grava 8 s do som captado a cada 30 s
let token='5b693364015546d94a865d48fe835e56'; try{ token=localStorage.getItem('audd')||token; }catch(e){}
document.getElementById('tok').addEventListener('click',()=>{
  const t=prompt('Cole sua chave (api_token) do AudD, gerada em audd.io:',token);
  if(t!==null){ token=t.trim(); try{ localStorage.setItem('audd',token); }catch(e){} }
});
let busy=false, nextIn=30000;
function recognize(){
  if(!on) return;
  if(!capStream||busy||!token){ setTimeout(recognize,15000); return; }
  busy=true; nextIn=30000;
  label.textContent='Ouvindo um trecho para reconhecer a música...';
  const chunks=[];
  let rec;
  try{ rec=new MediaRecorder(new MediaStream(capStream.getAudioTracks())); }
  catch(e){ busy=false; label.textContent='Este navegador não grava o áudio captado'; return; }
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
    try{
      const fd=new FormData();
      fd.append('api_token',token);
      fd.append('return','timecode,apple_music,spotify');
      fd.append('file',new Blob(chunks,{type:rec.mimeType||'audio/webm'}),'trecho.webm');
      const r=await fetch('https://api.audd.io/',{method:'POST',body:fd});
      const j=await r.json();
      if(j.status==='error'){ label.textContent='AudD: '+((j.error&&j.error.error_message)||'erro desconhecido'); }
      else if(!j.result){ label.textContent='Música não reconhecida. Tentando de novo em instantes...'; nextIn=12000; }
      if(j.result&&j.result.title){
        np.value=(j.result.artist?j.result.artist+' - ':'')+j.result.title;
        label.textContent='Reconhecida. Captando o som do notebook (clique para parar)';
        setSongColor(j.result,np.value);
        onRecognized(j.result,np.value);
        try{ localStorage.setItem('np',np.value); }catch(e){}
      }
    }catch(e){
      label.textContent='Reconhecimento falhou. Abra o index.html salvo no computador e confira a chave';
    }
    busy=false;
    if(on) setTimeout(recognize,nextIn);
  };
  rec.start();
  setTimeout(()=>{ if(rec.state!=='inactive') rec.stop(); },8000);
}
</script>
